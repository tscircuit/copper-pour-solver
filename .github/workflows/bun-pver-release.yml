# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Publish to npm
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover (for example, v0.0.48)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  UPSTREAM_REPOS: "" # comma-separated list, e.g. "eval,tscircuit,docs"
  UPSTREAM_PACKAGES_TO_UPDATE: "" # comma-separated list, e.g. "@tscircuit/core,@tscircuit/protos"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || 'main' }}
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check whether the checked-out version is published
        id: npm-release
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          status="$(curl --silent --show-error --location --max-time 30 \
            --output "$RUNNER_TEMP/npm-release.json" --write-out '%{http_code}' \
            "https://registry.npmjs.org/$package_name/$package_version")"
          case "$status" in
            200) echo "unpublished=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "unpublished=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Cannot check npm publication status (HTTP $status)"
              exit 1
              ;;
          esac

      - name: Publish the prepared release or recover an existing tag
        if: inputs.release_tag != '' || steps.npm-release.outputs.unpublished == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('v{0}', steps.npm-release.outputs.version) }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like v0.0.48"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$expected_version" ]]; then
            echo "Tag $RELEASE_TAG contains package version $package_version, expected $expected_version"
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          if [[ "${{ steps.npm-release.outputs.unpublished }}" == "false" ]]; then
            echo "$package_name@$package_version is already published"
            exit 0
          fi

          npm pkg set repository.type=git
          npm pkg set repository.url=git+https://github.com/tscircuit/copper-pour-solver.git
          npm publish --access public

      - name: Create and publish the next release
        if: inputs.release_tag == '' && steps.npm-release.outputs.unpublished == 'false'
        run: pver release --no-push-main
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Verify the release exists on npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package_name@$package_version" version)"
          if [[ "$published_version" != "$package_version" ]]; then
            echo "::error::$package_name@$package_version was not published"
            exit 1
          fi

      - name: Create Pull Request
        if: inputs.release_tag == '' && steps.npm-release.outputs.unpublished == 'false'
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump version"
          title: "chore: bump version"
          body: "Automated package update"
          branch: bump-version-${{ github.run_number }}
          base: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>

      - name: Enable auto-merge
        if: inputs.release_tag == '' && steps.npm-release.outputs.unpublished == 'false' && steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

